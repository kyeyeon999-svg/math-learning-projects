<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>나의 일기장 · 수학 놀이터</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="diary.css"></head><body class="learning"><a class="skip-link" href="#diary-main">일기로 건너뛰기</a><header><a class="brand" id="home" href="../index.html">✳ 수학 놀이터</a><span class="tag">내 컴퓨터에 차곡차곡</span></header><main id="diary-main" class="diary-main" tabindex="-1"><span class="eyebrow">나만의 작은 기록</span><h1>오늘은 어떤 하루였나요?</h1><p>마음에 남은 순간을 천천히 적어 보세요.</p><p id="notice" role="status" aria-live="polite">일기를 불러오고 있어요.</p><div class="diary-layout"><aside class="panel diary-list"><div class="diary-toolbar"><h2>나의 기록</h2><button class="primary" id="new">새 일기 ＋</button></div><label for="search">일기 찾기</label><input id="search" type="search" placeholder="제목 또는 내용 검색"><button id="reload" type="button">목록 다시 불러오기</button><p id="list-count"></p><ul id="entries"></ul></aside><section class="panel diary-editor" aria-labelledby="editor-title"><h2 id="editor-title" tabindex="-1">새 일기</h2><form id="entry-form"><fieldset id="entry-fields"><label for="entry-date">날짜</label><input id="entry-date" type="date" required min="1900-01-01" max="9999-12-31"><label for="entry-title">제목</label><input id="entry-title" required maxlength="100" placeholder="오늘을 한마디로"><label for="entry-body">오늘의 이야기</label><textarea id="entry-body" required maxlength="20000" rows="12" placeholder="어떤 일이 있었나요? 어떤 마음이 들었나요?" aria-describedby="body-count save-help"></textarea><p id="body-count" class="note"></p><p id="save-help" class="note">자동 저장되지 않아요. 다 쓴 뒤 ‘일기 저장’을 눌러 주세요.</p><div class="actions"><button type="submit" class="primary" id="save">일기 저장</button><button type="button" id="delete" hidden>일기 삭제</button></div></fieldset></form><p id="saved-at" class="note"></p></section></div><p class="note">일기는 Windows 로컬 앱 데이터의 MathHub/diary-data 폴더에 저장해요. 구구단 학습 기록은 저장하지 않아요.</p></main><footer>하루의 작은 순간도 소중한 기록이에요.</footer><dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-text"><h2 id="confirm-title">확인해 주세요</h2><p id="confirm-text"></p><form method="dialog" class="actions"><button value="cancel" autofocus>취소</button><button value="yes" class="primary" id="confirm-yes">계속</button></form></dialog><noscript>일기장을 사용하려면 JavaScript를 켜 주세요.</noscript><script type="module" src="app.js"></script></body></html>
